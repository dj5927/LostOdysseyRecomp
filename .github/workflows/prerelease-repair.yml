name: Prerelease repair workspace
on:
  push:
    branches: [0.6.0-prerelease]
    paths: [.github/workflows/prerelease-repair.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source for the audit repair
        run: git archive --format=tar.gz --output=source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: prerelease-repair-source
          path: source.tar.gz
          retention-days: 1
