name: Prerelease repair validation
on:
  push:
    branches: [0.6.0-prerelease]
    paths: [.github/workflows/prerelease-repair.yml]
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0.6.0-prerelease
      - name: Retrieve reviewed patch objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          blobs = ['0d640e8e2049faef9ad300293e01910569e4121a', '1f913873411a4bdfc7a80dde8c9599c23c6b7cbf', 'b3f59f5f62b04ab58c9dd15561a1ac6aa16cf13b', '4d17de827f109b37a3c607159a3a65f3afdcb316']
          compressed = b''
          for sha in blobs:
              obj = json.loads(subprocess.check_output(['gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{sha}']))
              compressed += base64.b64decode(obj['content'])
          assert hashlib.sha256(compressed).hexdigest() == 'aa31a3e55ee3a3b1e125974cd7a449620df5ba54c0b1ff8b89a1c11a88081fab'
          patch = lzma.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == '52886f132f95b9b4943bdfa609a017b41d9b63d88fa76eb21ebd68584de631e8'
          pathlib.Path('/tmp/repair.patch').write_bytes(patch)
          PY
      - name: Apply and test source repairs
        run: |
          test "$(git branch --show-current)" = 0.6.0-prerelease
          if git apply --reverse --check /tmp/repair.patch >/dev/null 2>&1; then
            echo 'Reviewed repairs are already present.'
          else
            git apply --check /tmp/repair.patch
            git apply --index /tmp/repair.patch
          fi
          git diff --cached --check
          g++ -std=c++20 -O2 -pthread -DNOMINMAX -I LostOdysseyRecomp tools/tests/prerelease_audit_test.cpp -o /tmp/prerelease-audit
          /tmp/prerelease-audit
      - name: Commit repairs on prerelease only
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'fix: resolve v0.5.20 audits for 0.6.0 prerelease'
            git push origin HEAD:refs/heads/0.6.0-prerelease
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git show --stat --oneline HEAD
  linux-production:
    needs: apply
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.revision }}
          submodules: recursive
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld ninja-build cmake libcurl4-openssl-dev libvulkan-dev pkg-config libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libasound2-dev libpulse-dev libwayland-dev libxkbcommon-dev libegl-dev libdecor-0-dev libdbus-1-dev libudev-dev
      - name: Retrieve pinned build input
        uses: actions/checkout@v4
        with:
          repository: freefrank/LostOdysseyRecomp-build-inputs
          ref: 77f076e0e03966736cbf8919ce793bafadce82d9
          path: out/build-input
          sparse-checkout: /default.xex
          sparse-checkout-cone-mode: false
          ssh-key: ${{ secrets.LO_BUILD_INPUT_KEY }}
          persist-credentials: false
      - name: Prepare production headers and game code
        env:
          LO_BUILD_XEX_PATH: out/build-input/default.xex
        run: |
          python3 tools/release/fetch_build_input.py
          git -C tools/XenonRecomp apply --reverse --check ../patches/XenonRecomp-lostodyssey.patch >/dev/null 2>&1 || git -C tools/XenonRecomp apply ../patches/XenonRecomp-lostodyssey.patch
          git -C thirdparty/plume apply --reverse --check ../../tools/patches/plume-lostodyssey.patch >/dev/null 2>&1 || git -C thirdparty/plume apply ../../tools/patches/plume-lostodyssey.patch
          cmake -S tools/xexdump -B out/build/tools -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build out/build/tools --target XenonRecomp XenonAnalyse xexdump --parallel 2
          python3 tools/ppc_codegen.py stamp-tool --executable out/build/tools/XenonRecomp/XenonRecomp/XenonRecomp
          out/build/tools/xexdump LostOdysseyRecompLib/private/disc1/default.xex LostOdysseyRecompLib/private/image_disc1.bin
          python3 tools/ppc_codegen.py generate --executable out/build/tools/XenonRecomp/XenonRecomp/XenonRecomp
      - name: Compile changed production translation units
        run: |
          cmake -S . -B out/build/audit -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          targets=()
          for src in kernel/imports.cpp kernel/xdm.cpp kernel/io/file_system.cpp kernel/xam.cpp cpu/guest_thread.cpp gpu/renderer.cpp gpu/video.cpp gpu/shader/xenos_translator.cpp; do
            targets+=("LostOdysseyRecomp/CMakeFiles/LostOdysseyRecomp.dir/$src.o")
          done
          cmake --build out/build/audit --parallel 2 --target "${targets[@]}" LoVertexCacheTest
          out/build/audit/LostOdysseyRecomp/LoVertexCacheTest
      - name: Production regression suites
        run: |
          python3 tools/tests/native_audit.py --cxx clang++ --sanitize --out out/audit/native
          python3 tools/tests/menu_boundary_regression.py --cxx clang++ --sanitize --out out/audit/menu
          python3 tools/tests/shader_prebuild_regression.py --cxx clang++ --sanitize --out out/audit/prebuild
          python3 tools/tests/kernel_lifetime_regression.py --cxx clang++ --sanitize --out out/audit/lifetime
          python3 tools/tests/presentation_failure_regression.py --cxx clang++ --sanitize --out out/audit/presentation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prerelease-linux-regression-logs
          path: |
            out/audit/**/*.log
            out/audit/**/results.json
          if-no-files-found: ignore
  windows-production:
    needs: apply
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.revision }}
          submodules: recursive
          persist-credentials: false
      - name: Retrieve pinned build input
        uses: actions/checkout@v4
        with:
          repository: freefrank/LostOdysseyRecomp-build-inputs
          ref: 77f076e0e03966736cbf8919ce793bafadce82d9
          path: out/build-input
          sparse-checkout: /default.xex
          sparse-checkout-cone-mode: false
          ssh-key: ${{ secrets.LO_BUILD_INPUT_KEY }}
          persist-credentials: false
      - name: Prepare production headers and game code
        shell: cmd
        env:
          LO_BUILD_XEX_PATH: out/build-input/default.xex
        run: |
          python tools/release/fetch_build_input.py || exit /b 1
          call tools\build_tools.bat || exit /b 1
          git -C thirdparty/plume apply --reverse --check ../../tools/patches/plume-lostodyssey.patch >nul 2>&1 || git -C thirdparty/plume apply ../../tools/patches/plume-lostodyssey.patch || exit /b 1
          out\build\tools\xexdump.exe LostOdysseyRecompLib\private\disc1\default.xex LostOdysseyRecompLib\private\image_disc1.bin || exit /b 1
          python tools/ppc_codegen.py generate || exit /b 1
      - name: Compile changed production translation units
        shell: cmd
        run: |
          call tools\setup_windows.bat || exit /b 1
          cmake -S . -B out/build/audit -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl || exit /b 1
          cmake --build out/build/audit --parallel 2 --target LostOdysseyRecomp/CMakeFiles/LostOdysseyRecomp.dir/kernel/imports.cpp.obj LostOdysseyRecomp/CMakeFiles/LostOdysseyRecomp.dir/kernel/xdm.cpp.obj LostOdysseyRecomp/CMakeFiles/LostOdysseyRecomp.dir/kernel/io/file_system.cpp.obj LostOdysseyRecomp/CMakeFiles/LostOdysseyRecomp.dir/kernel/xam.cpp.obj LostOdysseyRecomp/CMakeFiles/LostOdysseyRecomp.dir/cpu/guest_thread.cpp.obj LostOdysseyRecomp/CMakeFiles/LostOdysseyRecomp.dir/gpu/renderer.cpp.obj LostOdysseyRecomp/CMakeFiles/LostOdysseyRecomp.dir/gpu/video.cpp.obj LostOdysseyRecomp/CMakeFiles/LostOdysseyRecomp.dir/gpu/shader/xenos_translator.cpp.obj LoVertexCacheTest || exit /b 1
          out\build\audit\LostOdysseyRecomp\LoVertexCacheTest.exe || exit /b 1
      - name: Production lifetime and display regression
        shell: cmd
        run: |
          call tools\setup_windows.bat || exit /b 1
          python tools/tests/kernel_lifetime_regression.py --cxx clang++ --out out/audit/lifetime || exit /b 1
          python tools/tests/presentation_failure_regression.py --cxx clang++ --out out/audit/presentation || exit /b 1
      - name: Portable shader runtime and release contract
        shell: cmd
        run: |
          call tools\setup_windows.bat || exit /b 1
          cmake -S tools/shader_pack -B out/audit/pack -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl || exit /b 1
          cmake --build out/audit/pack --target LoShaderPackTool LoPortableShaderPackTest LoPortableShaderPackIntegrationTest LoPortableShaderContractTest --parallel 2 || exit /b 1
          ctest --test-dir out/audit/pack --output-on-failure || exit /b 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prerelease-windows-regression-logs
          path: out/audit/**/*.log
          if-no-files-found: ignore
