name: MV regression validation
on:
  push:
    branches: [mv]
    paths: ['.github/workflows/mv-validation.yml', 'LostOdysseyRecomp/gpu/**', 'tools/tests/*motion*', 'tools/tests/*mv*', 'tools/mv/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mv-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export public source and pinned graphics dependencies
        run: |
          git submodule update --init --depth=1 thirdparty/plume tools/XenosRecomp thirdparty/unordered_dense
          git -C thirdparty/plume submodule update --init --recursive --depth=1
          mkdir -p out/mv-validation
          git rev-parse HEAD > out/mv-validation/source-revision.txt
          tar --exclude='.git' --exclude='./out' -czf out/mv-validation/public-source.tar.gz .
      - name: Install software Vulkan fixture environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
          mkdir -p out/mv-validation/driver
          dpkg-query -W mesa-vulkan-drivers libvulkan1 > out/mv-validation/driver/packages.txt
          cp /usr/share/vulkan/icd.d/lvp_icd*.json out/mv-validation/driver/
          cp /usr/lib/x86_64-linux-gnu/libvulkan_lvp.so out/mv-validation/driver/
          ldd /usr/lib/x86_64-linux-gnu/libvulkan_lvp.so > out/mv-validation/driver/ldd.txt
          for library in $(ldd /usr/lib/x86_64-linux-gnu/libvulkan_lvp.so | awk '/=> \// {print $3}'); do cp -L "$library" out/mv-validation/driver/; done
          vulkaninfo --summary > out/mv-validation/vulkan.txt 2>&1
      - name: Build CPU reference
        run: |
          set -o pipefail
          g++ -std=c++20 -O2 -I LostOdysseyRecomp tools/tests/motion_vector_test.cpp -o out/mv-validation/test
          out/mv-validation/test | tee out/mv-validation/reference.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mv-software-vulkan-${{ github.sha }}
          path: |
            out/mv-validation/driver/
            out/mv-validation/vulkan.txt
            out/mv-validation/reference.txt
            out/mv-validation/public-source.tar.gz
            out/mv-validation/source-revision.txt
          retention-days: 1
