name: MV regression validation
on:
  push:
    branches: [mv]
    paths:
      - '.github/workflows/mv-validation.yml'
      - 'LostOdysseyRecomp/gpu/**'
      - 'tools/tests/*motion*'
      - 'tools/tests/*mv*'
      - 'tools/mv/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mv-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Record revision and pinned public dependencies
        run: |
          mkdir -p out/mv-validation
          git rev-parse HEAD > out/mv-validation/revision.txt
          git submodule status --recursive >> out/mv-validation/revision.txt
          git -C thirdparty/plume apply --reverse --check ../../tools/patches/plume-lostodyssey.patch >/dev/null 2>&1 || git -C thirdparty/plume apply ../../tools/patches/plume-lostodyssey.patch
          tar --exclude=.git -cf out/mv-validation/dependencies.tar thirdparty/plume thirdparty/unordered_dense thirdparty/o1heap tools/XenonRecomp/XenonUtils tools/XenonRecomp/thirdparty tools/XenosRecomp/thirdparty/dxc-bin
      - name: Build and run CPU reference (not GPU acceptance)
        run: |
          set -o pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -I LostOdysseyRecomp tools/tests/motion_vector_test.cpp -o out/mv-validation/motion-vector-test
          out/mv-validation/motion-vector-test | tee out/mv-validation/reference.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mv-validation-${{ github.sha }}
          path: |
            out/mv-validation/revision.txt
            out/mv-validation/dependencies.tar
            out/mv-validation/reference.txt
          retention-days: 1
