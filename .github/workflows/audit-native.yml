name: Native audit fixtures
on:
  push:
    branches: [main, menu, 0.6.0-prerelease]
    paths:
      - '.github/workflows/audit-native.yml'
      - 'LostOdysseyRecomp/**'
      - 'tools/tests/**'
      - 'tools/shader_pack/**'
      - 'tools/release/**'
      - 'tools/portable_shader_pack_payload.py'
      - 'cmake/portable_shader_pack.cmake'
      - 'CMakeLists.txt'
  pull_request:
    branches: [main, menu, 0.6.0-prerelease]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: native-audit-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true
jobs:
  linux-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: CPU fixtures with ASan and UBSan
        run: python3 tools/tests/native_audit.py --cxx clang++ --sanitize --out out/audit/native
      - name: Production menu boundaries
        run: python3 tools/tests/menu_boundary_regression.py --cxx clang++ --sanitize --out out/audit/menu
      - name: Production shader preparation boundaries
        run: python3 tools/tests/shader_prebuild_regression.py --cxx clang++ --sanitize --out out/audit/prebuild
      - name: Production thread lifetime and presentation failures
        run: |
          python3 tools/tests/kernel_lifetime_regression.py --cxx clang++ --sanitize --out out/audit/lifetime
          python3 tools/tests/presentation_failure_regression.py --cxx clang++ --sanitize --out out/audit/presentation
      - name: Portable pack core, runtime integration and release contract
        run: |
          cmake -S tools/shader_pack -B out/audit/pack -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build out/audit/pack --target LoShaderPackTool LoPortableShaderPackTest LoPortableShaderPackIntegrationTest LoPortableShaderContractTest --parallel 2
          ctest --test-dir out/audit/pack --output-on-failure
      - name: Preserve CPU fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-cpu-audit
          path: |
            out/audit/**/*.log
            out/audit/**/results.json
          if-no-files-found: ignore
          retention-days: 7
  windows-cpu:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive
          persist-credentials: false
      # Standalone fixtures deliberately exclude real DXC, GPU drivers and game
      # inputs. Assertions remain enabled. Scratch paths are unique per fixture.
      - name: Compile Windows cache, resource and queue fixtures
        shell: cmd
        run: |
          call tools\setup_windows.bat || exit /b 1
          mkdir out\audit\windows
          for %%T in (prerelease_audit shader_preparation_queue shader_prebuild_io shader_startup_cache shader_resource_scan shader_resource_variants cpx_decode backend_selection) do (
            clang-cl /nologo /std:c++20 /EHsc /O1 /utf-8 /DNOMINMAX /DLO_TEST_NO_DXC /I LostOdysseyRecomp tools\tests\%%T_test.cpp /Fe:out\audit\windows\%%T.exe /Fo:out\audit\windows\%%T.obj > out\audit\windows\%%T.build.log 2>&1
            if errorlevel 1 (type out\audit\windows\%%T.build.log & exit /b 1)
          )
      - name: Run Windows CPU fixtures
        shell: cmd
        run: |
          for %%T in (shader_preparation_queue shader_prebuild_io shader_startup_cache shader_resource_scan shader_resource_variants) do (
            out\audit\windows\%%T.exe out\audit\windows\%%T-data > out\audit\windows\%%T.run.log 2>&1
            if errorlevel 1 (type out\audit\windows\%%T.run.log & exit /b 1)
            type out\audit\windows\%%T.run.log
          )
          for %%T in (prerelease_audit cpx_decode backend_selection) do (
            out\audit\windows\%%T.exe > out\audit\windows\%%T.run.log 2>&1
            if errorlevel 1 (type out\audit\windows\%%T.run.log & exit /b 1)
            type out\audit\windows\%%T.run.log
          )
          out\audit\windows\shader_preparation_queue.exe --launch-exception-only out\audit\windows\launch-failure > out\audit\windows\launch-failure.run.log 2>&1
          if errorlevel 1 (type out\audit\windows\launch-failure.run.log & exit /b 1)
          type out\audit\windows\launch-failure.run.log
      - name: Production thread and presentation regression
        shell: cmd
        run: |
          call tools\setup_windows.bat || exit /b 1
          python tools/tests/kernel_lifetime_regression.py --cxx clang++ --out out/audit/windows/lifetime || exit /b 1
          python tools/tests/presentation_failure_regression.py --cxx clang++ --out out/audit/windows/presentation || exit /b 1
      - name: Portable pack core, runtime integration and release contract
        shell: cmd
        run: |
          call tools\setup_windows.bat || exit /b 1
          cmake -S tools/shader_pack -B out/audit/pack -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl || exit /b 1
          cmake --build out/audit/pack --target LoShaderPackTool LoPortableShaderPackTest LoPortableShaderPackIntegrationTest LoPortableShaderContractTest --parallel 2 || exit /b 1
          ctest --test-dir out/audit/pack --output-on-failure || exit /b 1
      - name: Preserve Windows fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-cpu-audit
          path: out/audit/**/*.log
          if-no-files-found: ignore
          retention-days: 7
