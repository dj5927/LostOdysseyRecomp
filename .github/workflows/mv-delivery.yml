name: Deliver validated geometric MV
on:
  push:
    branches: [mv]
    paths: ['.github/workflows/mv-delivery.yml', 'tools/mv/delivery/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mv-delivery
  cancel-in-progress: false
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Preserve byte-exact sources
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply fingerprint-checked implementation
        run: python tools/mv/delivery/apply.py
      - name: Prepare pinned public dependencies
        shell: bash
        run: |
          git submodule update --init --depth=1 thirdparty/plume tools/XenosRecomp thirdparty/unordered_dense
          git -C thirdparty/plume submodule update --init --recursive --depth=1
          git -C tools/XenosRecomp submodule update --init --depth=1 thirdparty/dxc-bin thirdparty/fmt
          git -C thirdparty/plume apply ../../tools/patches/plume-lostodyssey.patch
      - name: Linux GPU build and execution
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools vulkan-validationlayers libx11-dev ninja-build
          cmake -S tools/tests/motion_replay -B out/mv-build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build out/mv-build --parallel 2
          export LO_DXC_PATH="$PWD/tools/XenosRecomp/thirdparty/dxc-bin/lib/x64/libdxcompiler.so"
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp*.json' | head -n 1)"
          export VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation
          ctest --test-dir out/mv-build -V --output-on-failure 2>&1 | tee out/mv-build/results.txt
          if grep -E 'Validation Error|ERROR.*VUID-' out/mv-build/results.txt; then exit 1; fi
          g++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -I LostOdysseyRecomp tools/tests/motion_vector_test.cpp -o out/mv-build/cpu-sanitized
          out/mv-build/cpu-sanitized | tee out/mv-build/sanitizers.txt
      - name: Windows build and shader compilation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S tools/tests/motion_replay -B out/mv-build -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build out/mv-build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:LO_DXC_PATH = "$pwd/tools/XenosRecomp/thirdparty/dxc-bin/bin/x64/dxcompiler.dll"
          & ./out/mv-build/Release/motion_vector_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./out/mv-build/Release/motion_replay_gpu_test.exe --compile-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mv-delivery-${{ matrix.os }}-${{ github.sha }}
          path: |
            out/mv-build/results.txt
            out/mv-build/sanitizers.txt
            out/mv-build/Testing/Temporary/LastTest.log
          retention-days: 7
  commit:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply exact tested sources
        run: python tools/mv/delivery/apply.py
      - name: Fast-forward only the authorized mv branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$GITHUB_REF" = refs/heads/mv
          git fetch origin mv
          test "$(git rev-parse origin/mv)" = "$EXPECTED_HEAD"
          python - <<'PY'
          import json,subprocess
          paths=json.load(open('out/mv-delivery-paths.json'))
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(mv): replace camera-only regression with bounded geometric history replay'
          git push origin HEAD:mv
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
