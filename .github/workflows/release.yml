name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to package; empty builds the selected ref'
        type: string
        required: false
      rebuild_ppc:
        description: 'Compile PPC from source instead of using the automatically synchronized library'
        type: boolean
        default: false

  push:
    tags: ['v*']

env:
  RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

permissions:
  contents: read

jobs:
  release-windows:
    name: Windows Release
    runs-on: windows-2022
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Validate requested tag
        if: env.RELEASE_TAG != ''
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9][0-9A-Za-z.+-]*$') { throw 'Expected a version tag starting with v.' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packaging tools
        run: python -m pip install -r tools/release/requirements.txt
      - name: Retrieve private build input
        uses: actions/checkout@v4
        with:
          repository: freefrank/LostOdysseyRecomp-build-inputs
          ref: 77f076e0e03966736cbf8919ce793bafadce82d9
          path: out/build-input
          sparse-checkout: |
            /default.xex
          sparse-checkout-cone-mode: false
          ssh-key: ${{ secrets.LO_BUILD_INPUT_KEY }}
          persist-credentials: false
      - name: Verify private build input
        env:
          LO_BUILD_XEX_PATH: out/build-input/default.xex
        run: python tools/release/fetch_build_input.py
      - name: Generate game code
        shell: cmd
        run: |
          call tools\build_tools.bat || exit /b 1
          out\build\tools\xexdump.exe LostOdysseyRecompLib\private\disc1\default.xex LostOdysseyRecompLib\private\image_disc1.bin || exit /b 1
          python tools\ppc_codegen.py generate || exit /b 1
      - name: Compute required PPC identity
        if: ${{ !inputs.rebuild_ppc }}
        id: ppc
        shell: cmd
        run: |
          call tools\setup_windows.bat || exit /b 1
          cmake -S . -B out/build/ppc-contract -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DLO_BUILD_RUNTIME=OFF -DLO_PREBUILT_PPC_DIR= -DLO_PPC_AUTO_SYNC=OFF || exit /b 1
          python tools/release/ppc_sync.py key --build-dir out/build/ppc-contract --github-output "%GITHUB_OUTPUT%" || exit /b 1
      - name: Record PPC cache identity
        if: ${{ !inputs.rebuild_ppc }}
        run: |
          @'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path('tools/release').resolve()))
          import ppc_sync
          root = Path.cwd()
          key, evidence = ppc_sync.identity(root, root / 'out/build/ppc-contract')
          Path('out/ppc-cache-identity.json').write_text(
              json.dumps({'key': key, **evidence}, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'key': key, 'contract': evidence['contract']}, indent=2))
          '@ | python
          if ($LASTEXITCODE -ne 0) { throw 'Could not record PPC cache identity.' }
      - name: Retrieve synchronized PPC library
        if: ${{ !inputs.rebuild_ppc }}
        uses: actions/checkout@v4
        with:
          repository: freefrank/LostOdysseyRecomp-build-inputs
          ref: main
          path: out/ppc-input
          sparse-checkout: /ppc/
          sparse-checkout-cone-mode: false
          ssh-key: ${{ secrets.LO_BUILD_INPUT_KEY }}
          persist-credentials: false
      - name: Verify synchronized PPC identity
        if: ${{ !inputs.rebuild_ppc }}
        run: |
          @'
          import json
          from pathlib import Path
          import subprocess
          import sys
          sys.path.insert(0, str(Path('tools/release').resolve()))
          import ppc_sync
          identity_path = Path('out/ppc-cache-identity.json')
          required = json.loads(identity_path.read_text())
          manifest = json.loads(Path('out/ppc-input/ppc/manifest.json').read_text())
          ppc_sync.validate_manifest(manifest, {k: required[k] for k in ('fingerprint', 'contract')})
          required['private_commit'] = subprocess.check_output(
              ['git', '-C', 'out/ppc-input', 'rev-parse', 'HEAD'], text=True).strip()
          identity_path.write_text(json.dumps(required, indent=2) + '\n', encoding='utf-8')
          print('Verified PPC main snapshot ' + required['private_commit'])
          '@ | python
          if ($LASTEXITCODE -ne 0) { throw 'PPC main does not match this source/compile identity. Synchronize the matching PPC library or dispatch with rebuild_ppc enabled.' }
      - name: Restore synchronized PPC library
        if: ${{ !inputs.rebuild_ppc }}
        run: |
          python tools/release/ppc_prebuilt.py restore --bundle out/ppc-input/ppc --output out/ppc-prebuilt
          if ($LASTEXITCODE -ne 0) { throw 'Synchronized PPC is damaged. Run local PPC synchronization or dispatch with rebuild_ppc enabled.' }
          "LO_PREBUILT_PPC_DIR=$((Resolve-Path out/ppc-prebuilt).Path)" >> $env:GITHUB_ENV
      - name: Build Release
        shell: cmd
        env:
          LO_BUILD_JOBS: '2'
        run: call tools\build_release.bat
      - name: Package runtime
        run: |
          if ($env:RELEASE_TAG) {
            python tools/package_release.py --version $env:RELEASE_TAG
          } else {
            python tools/package_release.py
          }
      - uses: actions/upload-artifact@v4
        with:
          name: LostOdysseyRecomp-windows-x64
          path: |
            out/releases/LostOdysseyRecomp-*.zip
            out/releases/LostOdysseyRecomp-*.sha256
          if-no-files-found: error
      - name: Upload PPC cache identity
        if: ${{ always() && steps.ppc.outputs.key != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: PPC-cache-identity
          path: out/ppc-cache-identity.json
          if-no-files-found: error
      - name: Create draft release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem out/releases/LostOdysseyRecomp-*.zip,out/releases/LostOdysseyRecomp-*.sha256 | ForEach-Object FullName
          $existing = gh release view $env:RELEASE_TAG --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Release already exists; preserving its reviewed assets.'
            exit 0
          }
          python tools/release/extract_release_notes.py --changelog CHANGELOG.md --version $env:RELEASE_TAG --output out/releases/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract release notes from CHANGELOG.md.' }
          gh release create $env:RELEASE_TAG --verify-tag --draft --notes-file out/releases/release-notes.md @assets

  release-linux:
    name: Linux Release
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Validate requested tag
        if: env.RELEASE_TAG != ''
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "Expected a version tag starting with v." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            lld \
            ninja-build \
            cmake \
            libcurl4-openssl-dev \
            libvulkan-dev \
            file \
            wget
          python -m pip install -r tools/release/requirements.txt
      - name: Retrieve private build input
        uses: actions/checkout@v4
        with:
          repository: freefrank/LostOdysseyRecomp-build-inputs
          ref: 77f076e0e03966736cbf8919ce793bafadce82d9
          path: out/build-input
          sparse-checkout: |
            /default.xex
          sparse-checkout-cone-mode: false
          ssh-key: ${{ secrets.LO_BUILD_INPUT_KEY }}
          persist-credentials: false
      - name: Verify private build input
        env:
          LO_BUILD_XEX_PATH: out/build-input/default.xex
        run: python tools/release/fetch_build_input.py
      - name: Apply dependency patches
        run: |
          git -C tools/XenonRecomp apply --reverse --check ../patches/XenonRecomp-lostodyssey.patch >/dev/null 2>&1 || git -C tools/XenonRecomp apply ../patches/XenonRecomp-lostodyssey.patch
          git -C thirdparty/plume apply --reverse --check ../../tools/patches/plume-lostodyssey.patch >/dev/null 2>&1 || git -C thirdparty/plume apply ../../tools/patches/plume-lostodyssey.patch
      - name: Build recompiler tools
        run: |
          cmake -S tools/xexdump -B out/build/tools -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++
          cmake --build out/build/tools --target XenonRecomp XenonAnalyse xexdump
          python tools/ppc_codegen.py stamp-tool --executable out/build/tools/XenonRecomp/XenonRecomp/XenonRecomp
      - name: Generate game code
        run: |
          out/build/tools/xexdump LostOdysseyRecompLib/private/disc1/default.xex LostOdysseyRecompLib/private/image_disc1.bin
          python tools/ppc_codegen.py generate --executable out/build/tools/XenonRecomp/XenonRecomp/XenonRecomp
      - name: Build Linux runtime
        run: |
          cmake -S . -B out/build/linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DLO_PREBUILT_PPC_DIR= \
            -DLO_PPC_AUTO_SYNC=OFF
          cmake --build out/build/linux --target LostOdysseyRecomp --parallel 2
      - name: Install linuxdeploy
        run: |
          mkdir -p out/tools/linuxdeploy
          wget -q -O out/tools/linuxdeploy/linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x out/tools/linuxdeploy/linuxdeploy
          echo "$GITHUB_WORKSPACE/out/tools/linuxdeploy" >> "$GITHUB_PATH"
      - name: Package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python tools/package_appimage.py --build out/build/linux --output out/releases --version "$RELEASE_TAG" --linuxdeploy out/tools/linuxdeploy/linuxdeploy
          else
            python tools/package_appimage.py --build out/build/linux --output out/releases --linuxdeploy out/tools/linuxdeploy/linuxdeploy
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: LostOdysseyRecomp-linux-x64
          path: |
            out/releases/LostOdysseyRecomp-*.AppImage
            out/releases/LostOdysseyRecomp-*.AppImage.sha256
          if-no-files-found: error
      - name: Upload Linux assets to draft release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          linux_assets=()
          for file in out/releases/LostOdysseyRecomp-*.AppImage out/releases/LostOdysseyRecomp-*.AppImage.sha256; do
            if [ -f "$file" ]; then
              linux_assets+=("$file")
            fi
          done
          if [ ${#linux_assets[@]} -gt 0 ]; then
            gh release upload "$RELEASE_TAG" "${linux_assets[@]}" --clobber
          fi
